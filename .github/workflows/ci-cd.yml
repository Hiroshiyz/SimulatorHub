name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run client linter
        run: npm run lint --prefix client

      - name: Run unit & integration tests
        run: npm test

  build-and-package:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Determine Docker Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=pre-release-${{ github.sha }},enable=${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=pre-release-latest,enable=${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-preview-deploy:
    needs: build-and-package
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Environment Variables
        run: |
          PR_NO=${{ github.event.number }}
          APP_PORT=$((3000 + PR_NO))
          DB_PORT=$((5000 + PR_NO))
          REDIS_PORT=$((6000 + PR_NO))
          echo "APP_PORT=$APP_PORT" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "REDIS_PORT=$REDIS_PORT" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy PR Preview via Docker Compose
        run: |
          echo "Deploying preview for PR #${{ github.event.number }} on port ${{ env.APP_PORT }}"
          export POSTGRES_USER=smarthub
          export POSTGRES_PASSWORD=preview_db_pass_pr_${{ github.event.number }}
          export POSTGRES_DB=DATABASE_PR_${{ github.event.number }}
          export REDIS_PASSWORD=preview_redis_pass_pr_${{ github.event.number }}
          export CREDENTIALS_TOKEN_B=preview_token_b_pr_${{ github.event.number }}
          export EMSP_BASE_URL=http://localhost:$((4000 + ${{ github.event.number }}))
          export HUB_BASE_URL=http://localhost:${{ env.APP_PORT }}
          
          # Inject the pre-built GHCR image into docker-compose MOCK_HUB_IMAGE env variable
          export MOCK_HUB_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          
          # Pull the pre-built image from GHCR
          docker pull $MOCK_HUB_IMAGE
          
          # Spin up the isolated stack
          docker compose -p pr-${{ github.event.number }} up -d

      - name: Comment PR with Preview Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="http://localhost:${{ env.APP_PORT }}"
          COMMENT_BODY="**PR Preview Deployed successfully!**
          - **Preview URL**: [$PR_URL]($PR_URL)
          - **Backend Port**: \`${{ env.APP_PORT }}\`
          - **Database Port**: \`${{ env.DB_PORT }}\`
          - **Redis Port**: \`${{ env.REDIS_PORT }}\`
          - **GHCR Image**: \`ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}\`
          
          This environment is fully isolated and will be automatically torn down when this PR is closed."
          
          gh pr comment ${{ github.event.number }} --body "$COMMENT_BODY" || echo "Failed to post comment."

  pr-preview-teardown:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tear Down PR Preview
        run: |
          echo "Tearing down preview environment for PR #${{ github.event.number }}"
          docker compose -p pr-${{ github.event.number }} down -v || true
